[project]
name = "payments-service"
version = "0.14.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "sqlalchemy>=2.0", "alembic>=1.13", "httpx>=0.27",
  "pydantic-settings>=2.4", "structlog>=24.1", "stripe>=10.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
exclude = ["tests/", "scripts/", "migrations/"]
